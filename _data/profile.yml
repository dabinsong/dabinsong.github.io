bio: >-
  I am a third-year PhD student in Economics at UC Irvine. I study how policies and
  new technologies shape labor markets — from pay transparency laws and workplace AI
  adoption to tax credits and education policy. My work combines administrative data
  with quasi-experimental methods, and my broader interests span applied
  microeconomics, labor, education, public, and experimental economics.

