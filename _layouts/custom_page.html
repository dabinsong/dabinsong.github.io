<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} · Dabin Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent:       #0284C7;
      --accent-mid:   #38BDF8;
      --accent-light: #E0F2FE;
      --yellow:       #FEF9C3;
      --yellow-text:  #92400E;
      --text:         #0f172a;
      --text-muted:   #64748B;
      --bg:           #FFFFFF;
      --surface:      #F8FAFC;
      --border:       #E2E8F0;
      --nav-bg:       #F8FAFC;
      --nav-text:     #0f172a;
      --radius:       12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ─────────────────────────────── */
    nav {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-inner {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 2rem;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-name {
      color: var(--nav-text);
      font-family: 'Lora', serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      list-style: none;
    }

    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      transition: color 0.15s;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--accent); }

    /* ── PAGE CONTENT ────────────────────── */
    .page-wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 2rem 80px;
      flex: 1;
    }

    .page-title {
      font-family: 'Lora', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
      line-height: 1.2;
    }

    .page-divider {
      border: none;
      border-top: 2px solid var(--accent-light);
      margin: 1.25rem 0 2.5rem;
    }

    /* Markdown content styles */
    .page-body h2 {
      font-family: 'Lora', serif;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text);
      margin: 2.5rem 0 0.75rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--border);
    }

    .page-body h3 {
      font-family: 'Lora', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
      margin: 1.75rem 0 0.5rem;
    }

    .page-body p {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.8;
      margin-bottom: 1rem;
    }

    .page-body ul,
    .page-body ol {
      color: var(--text-muted);
      font-size: 0.975rem;
      line-height: 1.8;
      margin: 0.5rem 0 1rem 1.5rem;
    }

    .page-body li { margin-bottom: 0.4rem; }

    .page-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid var(--accent-light);
      transition: border-color 0.15s;
    }

    .page-body a:hover {
      border-bottom-color: var(--accent);
    }

    .page-body strong { color: var(--text); font-weight: 600; }

    .page-body iframe {
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    /* ── FOOTER ──────────────────────────── */
    footer {
      border-top: 1px solid var(--border);
      padding: 1.25rem 2rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* ── RESPONSIVE ──────────────────────── */
    @media (max-width: 620px) {
      .nav-links { gap: 1rem; }
      .page-wrap { padding: 40px 1.5rem 60px; }
      .page-title { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-inner">
    <a href="/" class="nav-name">Dabin Song</a>
    <ul class="nav-links">
      <li><a href="/research" {% if page.url contains '/research' %}class="active"{% endif %}>Research</a></li>
      <li><a href="/teaching" {% if page.url contains '/teaching' %}class="active"{% endif %}>Teaching</a></li>
      <li><a href="/data" {% if page.url contains '/data' %}class="active"{% endif %}>Data</a></li>
      <li><a href="/cv" {% if page.url contains '/cv' %}class="active"{% endif %}>CV</a></li>
      <li><a href="/hobby-projects" {% if page.url contains '/hobby-projects' %}class="active"{% endif %}>Hobby Projects</a></li>
    </ul>
  </div>
</nav>

<!-- CONTENT -->
<div class="page-wrap">
  <h1 class="page-title">{{ page.title }}</h1>
  <hr class="page-divider">
  <div class="page-body">
    {{ content }}
  </div>
</div>

<!-- FOOTER -->
<footer>
  <p>© 2025 Dabin Song &middot; University of California, Irvine</p>
</footer>

</body>
</html>
